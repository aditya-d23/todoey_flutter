<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - AI Productivity Coach</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone">
    <div class="status-bar"><span data-time>09:30</span><span class="status-icons"><i class="signal"></i><i class="signal"></i><i class="signal"></i><i class="pill-dot"></i></span></div>
    <section class="screen login-screen">
      <div class="login-hero">
        <div class="coach-mark">AI</div>
        <p class="eyebrow">Goal automation system</p>
        <h1>Welcome back to your day planner.</h1>
        <p>Login to let the coach turn your yearly, monthly, and daily goals into an automated schedule.</p>
      </div>

      <form class="login-form">
        <label>
          <span>Email</span>
          <input type="email" value="aditya@example.com" aria-label="Email">
        </label>
        <label>
          <span>Password</span>
          <input type="password" value="productivity" aria-label="Password">
        </label>
        <a class="btn" href="onboarding.html">Login and start coaching</a>
        <a class="btn secondary" href="dashboard.html">View existing dashboard</a>
      </form>

      <div class="login-strip">
        <div><strong>Alarm</strong><span>Auto set</span></div>
        <div><strong>Plan</strong><span>AI made</span></div>
        <div><strong>Report</strong><span>Daily yearly</span></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
